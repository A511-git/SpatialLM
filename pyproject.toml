[project]
name = "spatiallm"
version = "0.1.1"
description = "SpatialLM: Training Large Language Models for Structured Indoor Modeling"
authors = [{ name = "ManyCore Research Team" }]
license = { text = "Llama3.2" }
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "torch-scatter",
    "transformers>=4.41.2,<=4.46.1",
    "tokenizers>=0.19.0,<0.20.4",
    "safetensors>=0.4.5",
    "pandas>=2.2.3",
    "einops>=0.8.1",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.15.0",
    "scikit-learn>=1.6.0",
    "toml>=0.10.2",
    "huggingface_hub>=0.25.0",
    "rerun-sdk>=0.21.0",
    "shapely>=2.0.7",
    "bbox>=0.9.4",
    "terminaltables>=3.1.10",
    "open3d>=0.18.0",
    "addict>=2.4.0",
    "spconv-cu120>=2.3.6",
    "timm>=1.0.0",
    "plotly>=5.0.0",
]

[project.optional-dependencies]
flash-attn = [
    "flash-attn",
]
training = [
    "omegaconf",
    "datasets<=3.6.0",
    "accelerate<=1.7.0",
    "wandb",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torch-scatter = { url = "https://data.pyg.org/whl/torch-2.4.0%2Bcu124/torch_scatter-2.1.2%2Bpt24cu124-cp310-cp310-linux_x86_64.whl" }
